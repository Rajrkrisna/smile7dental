name: Build Smile7 Dental iOS App

on:
  push:
    branches: [ mobile-app, main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS App & Package
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Copy Web Application Assets to iOS
        run: |
          npx cap copy ios
          ls -la ios/App/App/public/

      - name: Build iOS Application (No Code Signing Required)
        run: |
          mkdir -p build-output
          xcodebuild clean build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-output/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package Output IPA & Xcode Project
        run: |
          APP_PATH=$(find build-output/DerivedData -name "App.app" -type d | head -n 1)
          echo "Found compiled app at: $APP_PATH"
          mkdir -p build-output/Payload
          cp -R "$APP_PATH" build-output/Payload/Smile7Dental.app
          cd build-output
          zip -r Smile7Dental-Clinic-iOS.ipa Payload
          zip -r Smile7Dental-Xcode-Project.zip ../ios/App
          ls -lh Smile7Dental*

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Smile7Dental-iOS-Package
          path: |
            build-output/Smile7Dental-Clinic-iOS.ipa
            build-output/Smile7Dental-Xcode-Project.zip
          retention-days: 30

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/mobile-app' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: mobile-latest
          name: Smile7 Dental Clinic Mobile Suite (Android & iOS)
          files: |
            build-output/Smile7Dental-Clinic-iOS.ipa
            build-output/Smile7Dental-Xcode-Project.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
