name: Build Smile7 Dental Android APK

on:
  push:
    branches: [ mobile-app, main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Android SDK Platforms & Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "platforms;android-35" "platforms;android-36" || true

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Package Output APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/Smile7Dental-Clinic.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Smile7Dental-Clinic-APK
          path: build-output/Smile7Dental-Clinic.apk
          retention-days: 30

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/mobile-app' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: mobile-latest
          name: Smile7 Dental Clinic Android APK
          body: |
            ## Smile7 Dental Clinic - Mobile Application
            
            ### How to Install on Android:
            1. Download **`Smile7Dental-Clinic.apk`** below.
            2. On your Android phone, tap the downloaded file.
            3. If Android prompts with security message, tap **Settings** and enable **Allow from this source**.
            4. Tap **Install** and open **Smile7 Dental**!
          files: build-output/Smile7Dental-Clinic.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
