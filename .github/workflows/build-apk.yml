name: Build Smile7 Dental Android APK

on:
  push:
    branches: [ mobile-app, main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Android SDK Platforms & Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "platforms;android-34" "build-tools;35.0.0" || true

      - name: Copy Web Application Assets to Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/

      - name: Ensure Gradle Wrapper Executable
        run: |
          chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: ./android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace > ../gradle.log 2>&1 || true

      - name: Package Output APK or Commit Log
        run: |
          APK_FILE=$(find android/ -name "*debug*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            echo "Found APK at: $APK_FILE"
            mkdir -p build-output
            cp "$APK_FILE" build-output/Smile7Dental-Clinic.apk
            ls -lh build-output/
          else
            echo "=== GRADLE LOG TAIL ==="
            tail -n 60 gradle.log
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git add gradle.log
            git commit -m "chore: save gradle error log"
            git push origin mobile-app
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Smile7Dental-Clinic-APK
          path: build-output/Smile7Dental-Clinic.apk
          retention-days: 30

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/mobile-app' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: mobile-latest
          name: Smile7 Dental Clinic Android APK
          body: |
            ## Smile7 Dental Clinic - Mobile Application
            
            ### How to Install on Android:
            1. Download **`Smile7Dental-Clinic.apk`** below.
            2. On your Android phone, tap the downloaded file.
            3. If Android prompts with a security warning, tap **Settings** and enable **Allow from this source**.
            4. Tap **Install** and open **Smile7 Dental**!
          files: build-output/Smile7Dental-Clinic.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
