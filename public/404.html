<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Smile7 Dental Clinic - Redirecting</title>
  <script>
    // GitHub Pages Single Page Application (SPA) redirect
    // Redirects all 404 routes back to root while preserving query tokens and hash
    var l = window.location;
    var query = l.search || '';
    var hash = l.hash || '';
    window.location.replace(l.protocol + '//' + l.host + '/' + query + hash);
  </script>
</head>
<body style="font-family: sans-serif; text-align: center; padding: 40px; color: #004884;">
  <h2>Smile7 Dental Clinic</h2>
  <p>Loading your invoice &amp; patient records...</p>
</body>
</html>
